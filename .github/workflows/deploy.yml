name: build
on:
  push:
    branches:
      - docs
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - uses: bradyajohnston/setup-blender@v4
        with: 
          version: latest
      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Run Scripts
        run: |
          uv run --with requests docs/_sitedev/build-repo.py
      - name: Generate Extension Index
        run: |
          blender --command extension server-generate --repo-dir=docs/extensions
      - name: Run Zensical through UV.
        run: |
          pip install zensical
          uv run zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
